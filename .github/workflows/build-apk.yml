name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Web App & Sync Capacitor
        run: npm run build:android

      - name: Sanitize Android Icons & Configure Signing
        run: |
          which convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          for img in android/app/src/main/res/*/*.png; do
            if [ -f "$img" ]; then
              convert "$img" "png32:$img" || true
            fi
          done
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle 2>/dev/null || true
          grep -q "signingConfig signingConfigs.debug" android/app/build.gradle || sed -i '/proguardFiles/a \            signingConfig signingConfigs.debug' android/app/build.gradle || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NumberMatch-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
